[project]
name = "qwen-image-modal"
version = "0.1.0"
description = "Run Qwen-Image-2.1 text-to-image inference on Modal from the command line"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "modal>=1.5",
]

[project.scripts]
qwen-image-modal = "qwen_image_modal:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
